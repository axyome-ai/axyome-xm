name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Clear use cases get prioritized faster.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case and the pain point clearly. The more concrete the scenario, the better.
      placeholder: |
        When I ask Copilot about errors from a specific date, I have to specify the date manually every time.
        I'd like a way to say "errors from last sprint" and have the date range resolved automatically.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried? Why are they insufficient?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP Tools (new tool or improvement)
        - Dashboard UI
        - Event Capture
        - Search / Recall
        - XM Wiki
        - Time Machine
        - Onboarding
        - Privacy / Security
        - Performance
        - Documentation
        - Other
